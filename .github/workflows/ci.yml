name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Apeiron.csproj

      - name: Build
        run: dotnet build Apeiron.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Apeiron.Tests/Apeiron.Tests.csproj -c Release --verbosity normal
